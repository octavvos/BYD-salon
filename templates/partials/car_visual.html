{% comment %}
  Avtomobil rasmi. Rasm yuklanmagan bo'lsa — kuzov turiga mos SVG siluet, aksent rangda.
  Parametrlar: car, size ("card" | "hero")
{% endcomment %}
{% if car.main_image %}
  <img class="car-visual car-visual--{{ size|default:'card' }}" src="{{ car.main_image.url }}" alt="{{ car.name }}" loading="lazy">
{% else %}
  {% with shape=car.body_type.shape %}
  <svg class="car-visual car-visual--{{ size|default:'card' }}" viewBox="0 0 400 160" role="img" aria-label="{{ car.name }}" style="--car: {{ car.accent_color }}">
    <defs>
      <linearGradient id="body-{{ car.pk }}-{{ size|default:'card' }}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color: var(--car); stop-opacity: .95"/>
        <stop offset="1" style="stop-color: var(--car); stop-opacity: .7"/>
      </linearGradient>
    </defs>
    <ellipse cx="200" cy="146" rx="180" ry="8" class="car-visual__shadow"/>
    {% if shape == "suv" %}
      <path fill="url(#body-{{ car.pk }}-{{ size|default:'card' }})" d="M20 112 C20 98 28 90 46 87 L96 80 L128 46 C134 40 142 37 154 37 L300 37 C314 37 322 43 330 53 L356 84 C374 88 382 97 382 110 L382 124 L20 124 Z"/>
      <path class="car-visual__glass" d="M140 78 L161 50 L232 50 L232 78 Z M242 50 L298 50 C306 50 312 54 316 60 L330 78 L242 78 Z"/>
      <path class="car-visual__line" d="M40 100 L362 100"/>
      {% with fx=96 rx=306 %}{% include "partials/_wheels.html" %}{% endwith %}
    {% elif shape == "hatchback" %}
      <path fill="url(#body-{{ car.pk }}-{{ size|default:'card' }})" d="M24 112 C24 98 32 92 50 90 L104 82 C124 60 150 46 190 44 L286 44 C304 44 314 50 322 62 L350 92 C368 96 376 103 376 113 L376 124 L24 124 Z"/>
      <path class="car-visual__glass" d="M120 82 C138 64 158 55 190 54 L210 54 L210 82 Z M220 54 L284 54 C296 54 302 58 308 66 L320 82 L220 82 Z"/>
      <path class="car-visual__line" d="M44 104 L358 104"/>
      {% with fx=100 rx=300 %}{% include "partials/_wheels.html" %}{% endwith %}
    {% else %}
      <path fill="url(#body-{{ car.pk }}-{{ size|default:'card' }})" d="M18 114 C18 100 28 94 48 91 L112 84 C134 64 164 50 204 48 C244 47 272 57 302 80 L354 88 C374 92 384 101 384 113 L384 124 L18 124 Z"/>
      <path class="car-visual__glass" d="M128 84 C148 68 172 58 202 57 L208 57 L208 84 Z M218 57 C246 58 268 66 288 82 L218 84 Z"/>
      <path class="car-visual__line" d="M38 104 L366 104"/>
      {% with fx=96 rx=306 %}{% include "partials/_wheels.html" %}{% endwith %}
    {% endif %}
  </svg>
  {% endwith %}
{% endif %}
